{% include base_path %}

<meta charset="utf-8">
<!-- GitHub Pages serves this browser policy through HTML. -->
<meta http-equiv="Content-Security-Policy"
      content="base-uri 'none'; object-src 'none'; form-action 'self'; script-src-attr 'none'; style-src 'self' https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
